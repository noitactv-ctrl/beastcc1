# Install this as an HTTPS virtual host after certificates exist for both domains.
# The old domain is redirect-only; the application is served on TurtleCC.xyz.
server {
    listen 443 ssl http2;
    server_name TurtleCC.xyz www.TurtleCC.xyz;

    ssl_certificate /etc/letsencrypt/live/TurtleCC.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TurtleCC.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name TurtleCC.xyz www.TurtleCC.xyz;
    return 301 https://TurtleCC.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name beastcc.xyz www.beastcc.xyz;

    ssl_certificate /etc/letsencrypt/live/beastcc.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beastcc.xyz/privkey.pem;

    return 301 https://TurtleCC.xyz$request_uri;
}

server {
    listen 80;
    server_name beastcc.xyz www.beastcc.xyz;
    return 301 https://TurtleCC.xyz$request_uri;
}